<!DOCTYPE html>
<html>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:8px">
  <tr><td style="padding:24px 24px 0">
    <table role="presentation" cellpadding="0" cellspacing="0"><tr>
      <td style="padding-right:10px;vertical-align:middle"><img src="{{logoUrl}}" width="32" height="32" alt="" style="display:block;border:0"></td>
      <td style="vertical-align:middle;font-size:14px;font-weight:bold;color:#111827">Subscription Master</td>
    </tr></table>
  </td></tr>
  <tr><td style="padding:8px 24px 0;font-size:20px;font-weight:bold;color:{{accent}}">{{title}}</td></tr>
  <tr><td style="padding:12px 24px 0;font-size:15px;line-height:22px;color:#111827">{{body}}</td></tr>
  <tr><td style="padding:24px">
    <a href="{{link}}" style="display:inline-block;background:#7c3aed;color:#ffffff;padding:10px 18px;border-radius:6px;text-decoration:none;font-size:14px">Open in Subscription Master</a>
  </td></tr>
  <tr><td style="padding:0 24px 24px;font-size:12px;color:#9ca3af">You get this because reminders are on in your notification settings.</td></tr>
</table>
</body>
</html>
