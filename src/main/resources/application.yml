server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: native

spring:
  application:
    name: subscribe-master
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:mirkamol}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    # Local dev default  → localhost:5222
    # Docker production  → jdbc:postgresql://db:5432/subscription_master_db
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5222/subscription_master_db}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        show_sql: ${HIBERNATE_SHOW_SQL:false}
  flyway.enabled: true
  cache:
    cache-names: exchange-rates
    caffeine.spec: maximumSize=32,expireAfterWrite=24h
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/gmail.readonly
              - https://www.googleapis.com/auth/gmail.send
app:
  jwt:
    # MUST be overridden via JWT_SECRET env-var in production (≥32 chars)
    secret: ${JWT_SECRET:secret-key-must-be-at-least-32-bytes}
    access-token-minutes: 15
    refresh-token-days: 30
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  notifications:
    reminder-hour: ${REMINDER_HOUR:9}
    reminder-cron: ${REMINDER_CRON:0 5 * * * *}
    status-max-age: 3d
    async-enabled: true
    max-concurrent: 4
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:admin@subscriptionmaster.app}
  status:
    overdue-grace-days: ${OVERDUE_GRACE_DAYS:5}
    renewal-window-days-before: ${RENEWAL_WINDOW_DAYS_BEFORE:3}
    daily-rules-cron: ${STATUS_RULES_CRON:0 15 * * * *}
  security:
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY}
    admin-emails: ${APP_ADMIN_EMAILS:}
  gmail:
    api-base-url: https://gmail.googleapis.com
    connect-timeout: 2s
    read-timeout: 10s
    retry-initial-backoff: 500ms
    attachments:
      max-bytes: ${GMAIL_ATTACHMENT_MAX_BYTES:26214400}
    sync:
      cron: ${GMAIL_SYNC_CRON:0 0 */6 * * *}
      stale-after: 30m
      async-enabled: true
      max-concurrent: 4
    detection:
      query: 'subject:(receipt OR invoice OR "payment received" OR "your subscription" OR renewal OR renewed OR "payment failed" OR declined OR canceled OR cancelled OR "won''t renew" OR "plan ended")'
      lookback: 13m
      keywords:
        receipt-subject: [receipt, invoice, "payment received", "payment confirmation", "order confirmation", "thanks for your payment", "your receipt"]
        subscription-subject: ["your subscription", renewal, renewed]
        payment-due: ["payment due", "payment is due", "due soon", "upcoming payment", "upcoming renewal", "renews soon", "will be charged", "we will charge"]
        free-plan: [free, "at no cost", "no charge"]
        recurring: [subscription, membership, plan, renews, renewal, auto-renewing, "per month", "per year", monthly, annually, yearly]
        payment-confirmation: ["thanks for your payment", "thank you for your payment", "payment received", "amount charged", "you paid", "we charged", "your card was charged", "payment confirmation"]
        cancellation: ["has been canceled", "has been cancelled", "subscription was canceled", "subscription was cancelled", "subscription canceled", "subscription cancelled", "won't renew", "will not renew", "plan ended", "plan has ended", "plan has been canceled", "plan has been cancelled", "membership ended", "membership has ended", "subscription ended", "subscription has ended", "sorry to see you go", "cancellation confirmed", "we've canceled", "we have cancelled"]
        payment-failed: ["payment failed", "payment declined", "payment was declined", "update your payment method", "billing issue", "billing problem", "unable to process your payment", "couldn't process your payment", "could not process your payment", "subscription is on hold", "payment unsuccessful"]
        promotion: [save, sale, "off your", cashback, "cash back", offer, promo, deal, discount, upgrade, "free trial", webinar, newsletter]
        access-ends: [until, "ends on", "end on", "will end", "expires on", "expire on", "access until", "active until"]
        access-ends-now: ["effective immediately", "ends immediately", "ended immediately", "with immediate effect"]
      processors: [stripe.com, paddle.com, paddle.net, payments-noreply@google.com, googleplay-noreply@google.com, apple.com]
      personal-mailbox-domains: [gmail.com, googlemail.com, outlook.com, hotmail.com, live.com, msn.com, yahoo.com, ymail.com, icloud.com, me.com, mac.com, aol.com, proton.me, protonmail.com, gmx.com, gmx.net, mail.com, zoho.com, yandex.ru, yandex.com, ya.ru, mail.ru, inbox.ru, list.ru, bk.ru, rambler.ru]
      merchants:
        - { key: netflix, display-name: Netflix, senders: [netflix.com], category: ENTERTAINMENT, default-cycle: MONTHLY }
        - { key: spotify, display-name: Spotify, senders: [spotify.com], category: ENTERTAINMENT, default-cycle: MONTHLY }
        - { key: youtube-premium, display-name: YouTube Premium, aliases: [YouTube, YouTube Music], senders: [youtube.com], category: ENTERTAINMENT, default-cycle: MONTHLY }
        - { key: google-one, display-name: Google One, aliases: [Google One AI Premium, Google AI Pro, Google AI Premium, Google AI Ultra, Gemini Advanced, Gemini Pro], senders: [], logo-domain: one.google.com, category: OTHER, default-cycle: MONTHLY }
        - { key: apple, display-name: Apple (App Store / iCloud), aliases: [Apple, iCloud, iCloud+, App Store, Apple Music, Apple TV+], senders: [apple.com], category: OTHER }
        - { key: amazon-prime, display-name: Amazon Prime, aliases: [Prime Video, Amazon Prime Video], senders: [prime@amazon.com, primevideo.com], category: ENTERTAINMENT }
        - { key: microsoft, display-name: Microsoft, aliases: [Microsoft 365, Office 365, Xbox Game Pass], senders: [microsoft.com, microsoftstore.com], category: PRODUCTIVITY }
        - { key: adobe, display-name: Adobe, aliases: [Adobe Creative Cloud, Creative Cloud], senders: [adobe.com], category: PRODUCTIVITY }
        - { key: openai, display-name: ChatGPT, aliases: [OpenAI, ChatGPT Plus], senders: [openai.com], category: AI_TOOLS, default-cycle: MONTHLY }
        - { key: anthropic, display-name: Claude, aliases: [Claude Pro, Claude Max, Anthropic], senders: [anthropic.com], category: AI_TOOLS, default-cycle: MONTHLY }
        - { key: notion, display-name: Notion, senders: [notion.so, makenotion.com], category: PRODUCTIVITY }
        - { key: github, display-name: GitHub, senders: [github.com], category: PRODUCTIVITY }
        - { key: canva, display-name: Canva, senders: [canva.com], category: PRODUCTIVITY }
        - { key: dropbox, display-name: Dropbox, senders: [dropbox.com, dropboxmail.com], category: PRODUCTIVITY }
  google:
    oauth-base-url: https://oauth2.googleapis.com
    connect-timeout: 2s
    read-timeout: 5s

  cbu.base-url: https://cbu.uz/uz/arkhiv-kursov-valyut/json/
  cbu.connect-timeout: 2s
  cbu.read-timeout: 3s
springdoc:
  swagger-ui.path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
resilience4j:
  retry:
    instances:
      googleOAuth:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.mirkamolcode.exception.GoogleApiUnavailableException
  circuitbreaker:
    instances:
      cbuRates:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 1
        ignore-exceptions:
          - java.lang.IllegalArgumentException
