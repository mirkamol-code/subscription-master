server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: native

spring:
  application:
    name: subscribe-master
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:mirkamol}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    # Local dev default  → localhost:5222
    # Docker production  → jdbc:postgresql://db:5432/subscription_master_db
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5222/subscription_master_db}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        show_sql: ${HIBERNATE_SHOW_SQL:false}
  flyway.enabled: true
  cache:
    cache-names: exchange-rates
    caffeine.spec: maximumSize=32,expireAfterWrite=24h
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/gmail.readonly
              - https://www.googleapis.com/auth/gmail.send
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
app:
  jwt:
    # MUST be overridden via JWT_SECRET env-var in production (≥32 chars)
    secret: ${JWT_SECRET:secret-key-must-be-at-least-32-bytes}
    access-token-minutes: 15
    refresh-token-days: 30
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  security:
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY}
    admin-emails: ${APP_ADMIN_EMAILS:}
  google:
    oauth-base-url: https://oauth2.googleapis.com
    connect-timeout: 2s
    read-timeout: 5s

  cbu.base-url: https://cbu.uz/uz/arkhiv-kursov-valyut/json/
  cbu.connect-timeout: 2s
  cbu.read-timeout: 3s
  notifications:
    log:
      enabled: ${LOG_NOTIFICATIONS_ENABLED:true}
    gmail:
      enabled: ${GMAIL_NOTIFICATIONS_ENABLED:false}
    gmail-from: ${GMAIL_FROM:}
springdoc:
  swagger-ui.path: /swagger-ui.html
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
resilience4j:
  retry:
    instances:
      googleOAuth:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.mirkamolcode.exception.GoogleApiUnavailableException
  circuitbreaker:
    instances:
      cbuRates:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 1
        ignore-exceptions:
          - java.lang.IllegalArgumentException
