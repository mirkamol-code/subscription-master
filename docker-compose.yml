services:
  app:
    container_name: subscription-master
    restart: unless-stopped
    image: subscription-master:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # ── Runtime profile ──
      SPRING_PROFILES_ACTIVE: prod
      # ── Database: RDS when SPRING_DATASOURCE_* are set in .env, otherwise the local "db" container ──
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/${POSTGRES_DB:-subscription_master_db}}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${POSTGRES_USER}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD}}
      # ── App settings ──
      APP_SEED_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # ── Google sign-in + Gmail access ──
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://subscriptionmaster.app/api/login/oauth2/code/google}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://subscriptionmaster.app}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}
      # ── Web Push (empty keys disable push) ──
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@subscriptionmaster.app}
      # ── Jobs ──
      GMAIL_SYNC_CRON: ${GMAIL_SYNC_CRON:-0 0 */6 * * *}
      REMINDER_CRON: ${REMINDER_CRON:-0 5 * * * *}
      STATUS_RULES_CRON: ${STATUS_RULES_CRON:-0 15 * * * *}
      OVERDUE_GRACE_DAYS: ${OVERDUE_GRACE_DAYS:-5}
      REMINDER_HOUR: ${REMINDER_HOUR:-9}
      GMAIL_ATTACHMENT_MAX_BYTES: ${GMAIL_ATTACHMENT_MAX_BYTES:-26214400}
      # ── SQL logging — keep off in production ──
      HIBERNATE_SHOW_SQL: "false"
      HIBERNATE_FORMAT_SQL: "false"
    depends_on:
      db:
        condition: service_healthy
    # Published on the loopback interface only, for the host's Nginx; not reachable from outside
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    networks:
      - subscribe-master-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    container_name: subscription_master_db
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-subscription_master_db}
    ports:
      - "127.0.0.1:5222:5432"   # reachable from the server itself or an SSH tunnel only
    restart: unless-stopped
    volumes:
      - subscription-master-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mirkamol} -d ${POSTGRES_DB:-subscription_master_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - subscribe-master-network

  # Only for hosts without their own Nginx: docker compose --profile bundled-nginx up -d
  nginx:
    profiles: ["bundled-nginx"]
    container_name: subscription-master-nginx
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro    # mount your SSL certs here
    depends_on:
      app:
        condition: service_healthy
    networks:
      - subscribe-master-network

networks:
  subscribe-master-network:
    driver: bridge

volumes:
  subscription-master-db:
