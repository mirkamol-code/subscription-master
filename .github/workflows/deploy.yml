name: Deploy Workflow
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_IMAGE_NAME: subscription-master
      DOCKER_COMPOSE_APP_SERVICE_NAME: app
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      EC2_PUBLIC_IP_ADDRESS: ${{ secrets.EC2_PUBLIC_IP_ADDRESS }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      APP_ADMIN_EMAILS: ${{ secrets.APP_ADMIN_EMAILS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Required Secrets
        run: |
          missing=""
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET TOKEN_ENCRYPTION_KEY JWT_SECRET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing"
            exit 1
          fi

      - name: Generate Build Number
        run: |
          BUILD_NUMBER=$(date +'%d%m%Y%H%M%S')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Generated Build Number: $BUILD_NUMBER"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Maven Clean Verify
        run: |
          mvn -B -ntp clean verify jib:build -Ddocker.image.tag=$BUILD_NUMBER

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.EC2_SSH_PRIVATE_KEY }}

      - name: SSH To EC2 and Deploy
        run: |
          encode() { printf '%s' "$1" | base64 -w0; }
          SERVER_ENV=""
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET TOKEN_ENCRYPTION_KEY JWT_SECRET VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY APP_ADMIN_EMAILS; do
            if [ -n "${!name}" ]; then
              encoded=$(encode "${!name}")
              echo "::add-mask::$encoded"
              SERVER_ENV="$SERVER_ENV$name $encoded"$'\n'
            fi
          done
          SERVER_ENV_B64=$(printf '%s' "$SERVER_ENV" | base64 -w0)
          echo "::add-mask::$SERVER_ENV_B64"
          COMPOSE_B64=$(base64 -w0 docker-compose.yml)
          ssh -o StrictHostKeyChecking=no ubuntu@$EC2_PUBLIC_IP_ADDRESS "sudo bash -s" << EOF
            set -e

            # 1. Detect directory where subscription-master is running
            COMPOSE_DIR=""
            if docker inspect subscription-master >/dev/null 2>&1; then
              COMPOSE_DIR=\$(docker inspect subscription-master --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' 2>/dev/null || true)
            fi

            if [ -z "\$COMPOSE_DIR" ] || [ ! -f "\$COMPOSE_DIR/docker-compose.yml" ]; then
              for d in /root /home/ubuntu/app /home/ubuntu/subscription-master /home/ubuntu; do
                if [ -f "\$d/docker-compose.yml" ]; then
                  COMPOSE_DIR="\$d"
                  break
                fi
              done
            fi

            if [ -z "\$COMPOSE_DIR" ]; then
              COMPOSE_DIR="/home/ubuntu/app"
              mkdir -p "\$COMPOSE_DIR"
            fi

            echo "Deploying in directory: \$COMPOSE_DIR"
            cd "\$COMPOSE_DIR"

            # 2. Update only the managed keys in .env (other values stay as they are)
            touch .env
            chmod 600 .env
            echo "$SERVER_ENV_B64" | base64 -d | while read -r key value_b64; do
              value=\$(echo "\$value_b64" | base64 -d)
              grep -v "^\$key=" .env > .env.next || true
              printf "%s='%s'\\n" "\$key" "\$value" >> .env.next
              mv .env.next .env
              chmod 600 .env
              echo "Updated \$key in .env"
            done

            # 3. Ship the repository docker-compose.yml (keeps a backup of the previous one)
            if [ -f docker-compose.yml ]; then
              cp docker-compose.yml docker-compose.yml.bak-$BUILD_NUMBER
            fi
            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml

            # 4. Point the app service at the image built in this run
            if [ -f docker-compose.yml ]; then
              sed -i -E "s|image: .*(subscription-master).*|image: $DOCKER_USERNAME/$DOCKER_IMAGE_NAME:$BUILD_NUMBER|" docker-compose.yml
            fi

            # 5. Pull and restart the app service
            docker compose pull $DOCKER_COMPOSE_APP_SERVICE_NAME || docker compose pull || true
            docker compose up -d $DOCKER_COMPOSE_APP_SERVICE_NAME || docker compose up -d

            # 6. Fail the deploy unless the app becomes healthy
            for attempt in \$(seq 1 24); do
              status=\$(docker inspect -f '{{ .State.Health.Status }}' subscription-master 2>/dev/null || echo missing)
              if [ "\$status" = "healthy" ]; then
                echo "App is healthy"
                break
              fi
              if [ "\$attempt" = "24" ]; then
                echo "App did not become healthy (status: \$status)"
                docker compose logs --tail=150 $DOCKER_COMPOSE_APP_SERVICE_NAME
                exit 1
              fi
              sleep 5
            done

            # 7. Keep only this build and the previous one of the app image, so the disk can't fill up
            docker images "$DOCKER_USERNAME/$DOCKER_IMAGE_NAME" --format '{{.Tag}}' \\
              | grep -vx "$BUILD_NUMBER" | grep -vx latest | tail -n +2 \\
              | while read -r tag; do docker rmi "$DOCKER_USERNAME/$DOCKER_IMAGE_NAME:\$tag" || true; done
            docker image prune -f
            docker ps
            echo "$BUILD_NUMBER" > build-number.txt
          EOF